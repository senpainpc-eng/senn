<!-- FIREBASE INTEGRATION (CLOUD FIRESTORE) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      deleteDoc, 
      doc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // KREDENSIAL FIREBASE DARI PROJECT SENN-MO1LY
    const firebaseConfig = {
      apiKey: "AIzaSyDLw7SgKUzNRO8Lr2Kt4N4Nng4dzAyv7Go",
      authDomain: "senn-mo1ly.firebaseapp.com",
      projectId: "senn-mo1ly",
      storageBucket: "senn-mo1ly.appspot.com",
      messagingSenderId: "281743088877",
      appId: "1:281743088877:web:9921e24b342593f0bdc0e4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const commentsCol = collection(db, 'comments');

    // Theme Toggle
    window.applyTheme = function(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
    };

    window.toggleTheme = function() {
      const isDark = document.documentElement.classList.contains('dark');
      window.applyTheme(!isDark);
    };

    (function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        window.applyTheme(true);
      } else if (savedTheme === 'light') {
        window.applyTheme(false);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        window.applyTheme(prefersDark);
      }
    })();

    // Music Player
    function playAudioAndSpin() {
      const music = document.getElementById('bgMusic');
      const vinyl = document.getElementById('vinylRecord');
      
      const playPromise = music.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          vinyl.classList.remove('[animation-play-state:paused]');
          vinyl.classList.add('[animation-play-state:running]');
          showToast(`Memutar Musik`);
        }).catch(() => {
          console.log("Autoplay diblokir browser.");
        });
      }
    }

    window.toggleMusic = function() {
      const music = document.getElementById('bgMusic');
      const vinyl = document.getElementById('vinylRecord');

      if (music.paused) {
        playAudioAndSpin();
      } else {
        music.pause();
        vinyl.classList.remove('[animation-play-state:running]');
        vinyl.classList.add('[animation-play-state:paused]');
        showToast(`Musik Dihentikan`);
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      playAudioAndSpin();
      const triggerAudio = () => {
        const music = document.getElementById('bgMusic');
        if (music.paused) playAudioAndSpin();
        document.removeEventListener('click', triggerAudio);
      };
      document.addEventListener('click', triggerAudio);
    });

    // Toast Global
    let toastTimeout;
    window.showToast = function(msg) {
      const toast = document.getElementById('toastNotification');
      const toastMsg = document.getElementById('toastMessage');
      
      toastMsg.textContent = msg;
      toast.classList.remove('hidden');
      toast.classList.remove('opacity-0');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        window.hideToast();
      }, 3000);
    };

    window.hideToast = function() {
      const toast = document.getElementById('toastNotification');
      toast.classList.add('opacity-0');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 300);
    };

    // Kirim Surat Email
    window.handleSendLetter = function(e) {
      e.preventDefault();
      const name = document.getElementById('senderName').value;
      const email = document.getElementById('senderEmail').value;
      const subject = document.getElementById('letterSubject').value;
      const body = document.getElementById('letterBody').value;

      const fullBody = `Pengirim: ${name}\nEmail: ${email}\n\nIsi Pesan:\n${body}`;
      window.location.href = `mailto:senpainpc@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(fullBody)}`;
      showToast(`Membuka aplikasi email...`);
      document.getElementById('letterForm').reset();
    };

    // Helper Fungsi untuk Mengelola ID Komentar di LocalStorage Perangkat
    function getMyCommentIds() {
      return JSON.parse(localStorage.getItem('my_comment_ids') || '[]');
    }

    function saveMyCommentId(docId) {
      const myComments = getMyCommentIds();
      myComments.push(docId);
      localStorage.setItem('my_comment_ids', JSON.stringify(myComments));
    }

    function removeMyCommentId(docId) {
      const myComments = getMyCommentIds().filter(id => id !== docId);
      localStorage.setItem('my_comment_ids', JSON.stringify(myComments));
    }

    // Fitur Komentar Realtime Cloud Firestore
    window.addComment = async function() {
      const input = document.getElementById('newCommentInput');
      const authorInput = document.getElementById('commentAuthorInput');
      const text = input.value.trim();
      const author = authorInput.value.trim() || 'Pembaca';

      if (!text) return;

      const now = new Date();
      const timeStr = now.toLocaleString('en-US', { 
        month: 'long', 
        day: 'numeric', 
        year: 'numeric', 
        hour: 'numeric', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: true 
      }) + " UTC+8";

      try {
        const docRef = await addDoc(commentsCol, {
          nama: author,
          pesan: text,
          waktu: timeStr,
          timestamp: Date.now()
        });

        // Simpan ID komentar ke localStorage perangkat pengirim
        saveMyCommentId(docRef.id);

        input.value = '';
        authorInput.value = '';
        showToast('Komentar berhasil dikirim!');
      } catch (err) {
        console.error("Error menambah dokumen: ", err);
        showToast('Gagal mengirim komentar!');
      }
    };

    window.deleteComment = async function(docId) {
      // Validasi apakah ID komentar ada di localStorage pengguna ini
      const myComments = getMyCommentIds();
      if (!myComments.includes(docId)) {
        showToast('Anda tidak memiliki izin untuk menghapus komentar ini!');
        return;
      }

      try {
        await deleteDoc(doc(db, 'comments', docId));
        removeMyCommentId(docId);
        showToast('Komentar berhasil dihapus.');
      } catch (err) {
        console.error("Error menghapus dokumen: ", err);
        showToast('Gagal menghapus komentar.');
      }
    };

    // Stream realtime data dari Firestore
    onSnapshot(commentsCol, (snapshot) => {
      const container = document.getElementById('commentContainer');
      if (!container) return;
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = '<div class="text-center font-mono text-xs text-zinc-500 py-4">Belum ada komentar. Jadilah yang pertama!</div>';
        return;
      }

      const docs = [];
      snapshot.forEach(docSnap => {
        docs.push({ id: docSnap.id, ...docSnap.data() });
      });
      docs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      // Ambil daftar komentar milik pengguna dari localStorage
      const myComments = getMyCommentIds();

      docs.forEach((comment) => {
        const item = document.createElement('div');
        item.className = "p-3 bg-amber-50/90 dark:bg-zinc-800/90 border border-zinc-700 dark:border-zinc-300 relative shadow-sm hover:rotate-[0.5deg] transition-transform";

        // Cek apakah komentar ini dikirim dari perangkat pengguna ini
        const isOwner = myComments.includes(comment.id);
        const deleteButtonHtml = isOwner 
          ? `<button onclick="deleteComment('${comment.id}')" class="text-zinc-400 hover:text-red-500 font-mono text-xs px-1 font-bold" title="Hapus Komentar Anda">&times;</button>`
          : '';

        item.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="font-hand text-xl text-zinc-900 dark:text-zinc-100 leading-snug">
              "${escapeHtml(comment.pesan || '')}"
            </div>
            ${deleteButtonHtml}
          </div>
          <div class="mt-2 flex items-center justify-between font-mono text-[10px] text-zinc-500 dark:text-zinc-400 border-t border-dashed border-zinc-300 dark:border-zinc-700 pt-1">
            <span>&pen; ${escapeHtml(comment.nama || 'Pembaca')}</span>
            <span>${escapeHtml(comment.waktu || '')}</span>
          </div>
        `;
        container.appendChild(item);
      });
    }, (err) => {
      console.error("Firestore error: ", err);
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
