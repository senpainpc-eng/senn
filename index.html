<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>senn</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            hand: ['"Caveat"', 'cursive'],
            mono: ['"Space Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }
  </style>
</head>
<body class="bg-amber-50 dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen transition-colors duration-300 font-sans p-4 md:p-8">

  <!-- Navigasi / Header -->
  <header class="max-w-2xl mx-auto flex justify-between items-center pb-6 border-b border-zinc-300 dark:border-zinc-800 mb-8">
    <h1 class="text-3xl font-bold font-hand tracking-wide">senn.</h1>
    <div class="flex items-center gap-3">
      <!-- Pemutar Musik Vinyl -->
      <button onclick="window.toggleMusic()" class="p-2 rounded-full bg-zinc-200 dark:bg-zinc-800 hover:opacity-80 transition flex items-center justify-center" title="Toggle Music">
        <div id="vinylRecord" class="w-6 h-6 rounded-full border-2 border-zinc-900 dark:border-zinc-100 border-t-transparent animate-spin-slow [animation-play-state:paused]"></div>
      </button>
      <!-- Mode Gelap/Terang -->
      <button onclick="window.toggleTheme()" class="px-3 py-1.5 rounded bg-zinc-200 dark:bg-zinc-800 font-mono text-xs hover:bg-zinc-300 dark:hover:bg-zinc-700 transition">
        🌓 Tema
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto space-y-10">

    <!-- Form Kirim Surat Email -->
    <section class="bg-amber-100/50 dark:bg-zinc-800/50 p-6 rounded-lg border border-zinc-300 dark:border-zinc-700 shadow-sm">
      <h2 class="text-xl font-bold font-mono mb-4 flex items-center gap-2">✉️ Kirim Pesan</h2>
      <form id="letterForm" onsubmit="window.handleSendLetter(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="senderName" placeholder="Nama Anda" required class="w-full p-2 text-sm bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded focus:outline-none focus:ring-1 focus:ring-zinc-500">
          <input type="email" id="senderEmail" placeholder="Email Anda" required class="w-full p-2 text-sm bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded focus:outline-none focus:ring-1 focus:ring-zinc-500">
        </div>
        <input type="text" id="letterSubject" placeholder="Subjek Pesan" required class="w-full p-2 text-sm bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded focus:outline-none focus:ring-1 focus:ring-zinc-500">
        <textarea id="letterBody" rows="3" placeholder="Tuliskan isi pesan di sini..." required class="w-full p-2 text-sm bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded focus:outline-none focus:ring-1 focus:ring-zinc-500"></textarea>
        <button type="submit" class="px-4 py-2 bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 text-xs font-mono font-bold rounded hover:opacity-90 transition">
          Kirim via Email
        </button>
      </form>
    </section>

    <!-- Bagian Komentar Firebase -->
    <section class="space-y-6">
      <h2 class="text-xl font-bold font-mono border-b border-zinc-300 dark:border-zinc-800 pb-2">💬 Komentar</h2>
      
      <!-- Input Komentar Baru -->
      <div class="bg-white dark:bg-zinc-900 p-4 rounded-lg border border-zinc-300 dark:border-zinc-700 space-y-3 shadow-sm">
        <input type="text" id="commentAuthorInput" placeholder="Nama Anda (opsional)" class="w-full p-2 text-sm bg-amber-50/50 dark:bg-zinc-800/50 border border-zinc-300 dark:border-zinc-700 rounded focus:outline-none">
        <textarea id="newCommentInput" rows="3" placeholder="Tulis komentar kamu di sini..." class="w-full p-2 text-sm bg-amber-50/50 dark:bg-zinc-800/50 border border-zinc-300 dark:border-zinc-700 rounded focus:outline-none"></textarea>
        <button onclick="window.addComment()" class="px-4 py-2 bg-amber-600 text-white font-mono text-xs rounded font-bold hover:bg-amber-700 transition">
          Kirim Komentar
        </button>
      </div>

      <!-- Container Komentar Realtime dari Firestore -->
      <div id="commentContainer" class="space-y-3">
        <div class="text-center font-mono text-xs text-zinc-500 py-4">Memuat komentar...</div>
      </div>
    </section>

  </main>

  <!-- Audio Element -->
  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <!-- Notifikasi Toast -->
  <div id="toastNotification" class="fixed bottom-4 right-4 bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 px-4 py-2 rounded shadow-lg font-mono text-xs transition-opacity duration-300 hidden opacity-0 z-50">
    <span id="toastMessage">Notifikasi</span>
  </div>

  <!-- FIREBASE INTEGRATION (CLOUD FIRESTORE) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      deleteDoc, 
      doc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // KREDENSIAL FIREBASE DARI PROJECT SENN-MO1LY
    const firebaseConfig = {
      apiKey: "AIzaSyDLw7SgKUzNRO8Lr2Kt4N4Nng4dzAyv7Go",
      authDomain: "senn-mo1ly.firebaseapp.com",
      projectId: "senn-mo1ly",
      storageBucket: "senn-mo1ly.appspot.com",
      messagingSenderId: "281743088877",
      appId: "1:281743088877:web:9921e24b342593f0bdc0e4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const commentsCol = collection(db, 'comments');

    // Theme Toggle
    window.applyTheme = function(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
    };

    window.toggleTheme = function() {
      const isDark = document.documentElement.classList.contains('dark');
      window.applyTheme(!isDark);
    };

    (function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        window.applyTheme(true);
      } else if (savedTheme === 'light') {
        window.applyTheme(false);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        window.applyTheme(prefersDark);
      }
    })();

    // Music Player
    function playAudioAndSpin() {
      const music = document.getElementById('bgMusic');
      const vinyl = document.getElementById('vinylRecord');
      
      if (!music || !vinyl) return;

      const playPromise = music.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          vinyl.classList.remove('[animation-play-state:paused]');
          vinyl.classList.add('[animation-play-state:running]');
          window.showToast(`Memutar Musik`);
        }).catch(() => {
          console.log("Autoplay diblokir browser.");
        });
      }
    }

    window.toggleMusic = function() {
      const music = document.getElementById('bgMusic');
      const vinyl = document.getElementById('vinylRecord');

      if (!music || !vinyl) return;

      if (music.paused) {
        playAudioAndSpin();
      } else {
        music.pause();
        vinyl.classList.remove('[animation-play-state:running]');
        vinyl.classList.add('[animation-play-state:paused]');
        window.showToast(`Musik Dihentikan`);
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      playAudioAndSpin();
      const triggerAudio = () => {
        const music = document.getElementById('bgMusic');
        if (music && music.paused) playAudioAndSpin();
        document.removeEventListener('click', triggerAudio);
      };
      document.addEventListener('click', triggerAudio);
    });

    // Toast Global
    let toastTimeout;
    window.showToast = function(msg) {
      const toast = document.getElementById('toastNotification');
      const toastMsg = document.getElementById('toastMessage');
      
      if (!toast || !toastMsg) return;

      toastMsg.textContent = msg;
      toast.classList.remove('hidden');
      toast.classList.remove('opacity-0');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        window.hideToast();
      }, 3000);
    };

    window.hideToast = function() {
      const toast = document.getElementById('toastNotification');
      if (!toast) return;
      toast.classList.add('opacity-0');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 300);
    };

    // Kirim Surat Email
    window.handleSendLetter = function(e) {
      if (e) e.preventDefault();
      const nameEl = document.getElementById('senderName');
      const emailEl = document.getElementById('senderEmail');
      const subjectEl = document.getElementById('letterSubject');
      const bodyEl = document.getElementById('letterBody');
      const formEl = document.getElementById('letterForm');

      const name = nameEl ? nameEl.value : '';
      const email = emailEl ? emailEl.value : '';
      const subject = subjectEl ? subjectEl.value : '';
      const body = bodyEl ? bodyEl.value : '';

      const fullBody = `Pengirim: ${name}\nEmail: ${email}\n\nIsi Pesan:\n${body}`;
      window.location.href = `mailto:senpainpc@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(fullBody)}`;
      window.showToast(`Membuka aplikasi email...`);
      if (formEl) formEl.reset();
    };

    // Helper Fungsi LocalStorage
    function getMyCommentIds() {
      try {
        return JSON.parse(localStorage.getItem('my_comment_ids') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveMyCommentId(docId) {
      const myComments = getMyCommentIds();
      myComments.push(docId);
      localStorage.setItem('my_comment_ids', JSON.stringify(myComments));
    }

    function removeMyCommentId(docId) {
      const myComments = getMyCommentIds().filter(id => id !== docId);
      localStorage.setItem('my_comment_ids', JSON.stringify(myComments));
    }

    // Fitur Komentar Realtime Cloud Firestore
    window.addComment = async function() {
      const input = document.getElementById('newCommentInput');
      const authorInput = document.getElementById('commentAuthorInput');
      
      if (!input) return;

      const text = input.value.trim();
      const author = (authorInput && authorInput.value.trim()) ? authorInput.value.trim() : 'Pembaca';

      if (!text) return;

      const now = new Date();
      const timeStr = now.toLocaleString('en-US', { 
        month: 'long', 
        day: 'numeric', 
        year: 'numeric', 
        hour: 'numeric', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: true 
      }) + " UTC+8";

      try {
        const docRef = await addDoc(commentsCol, {
          nama: author,
          pesan: text,
          waktu: timeStr,
          timestamp: Date.now()
        });

        saveMyCommentId(docRef.id);

        input.value = '';
        if (authorInput) authorInput.value = '';
        window.showToast('Komentar berhasil dikirim!');
      } catch (err) {
        console.error("Error menambah dokumen: ", err);
        window.showToast('Gagal mengirim komentar!');
      }
    };

    window.deleteComment = async function(docId) {
      const myComments = getMyCommentIds();
      if (!myComments.includes(docId)) {
        window.showToast('Anda tidak memiliki izin untuk menghapus komentar ini!');
        return;
      }

      try {
        await deleteDoc(doc(db, 'comments', docId));
        removeMyCommentId(docId);
        window.showToast('Komentar berhasil dihapus.');
      } catch (err) {
        console.error("Error menghapus dokumen: ", err);
        window.showToast('Gagal menghapus komentar.');
      }
    };

    // Stream realtime data dari Firestore
    onSnapshot(commentsCol, (snapshot) => {
      const container = document.getElementById('commentContainer');
      if (!container) return;
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = '<div class="text-center font-mono text-xs text-zinc-500 py-4">Belum ada komentar. Jadilah yang pertama!</div>';
        return;
      }

      const docs = [];
      snapshot.forEach(docSnap => {
        docs.push({ id: docSnap.id, ...docSnap.data() });
      });
      docs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      const myComments = getMyCommentIds();

      docs.forEach((comment) => {
        const item = document.createElement('div');
        item.className = "p-3 bg-amber-50/90 dark:bg-zinc-800/90 border border-zinc-700 dark:border-zinc-300 relative shadow-sm hover:rotate-[0.5deg] transition-transform";

        const isOwner = myComments.includes(comment.id);
        const deleteButtonHtml = isOwner 
          ? `<button onclick="window.deleteComment('${comment.id}')" class="text-zinc-400 hover:text-red-500 font-mono text-xs px-1 font-bold" title="Hapus Komentar Anda">&times;</button>`
          : '';

        item.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="font-hand text-xl text-zinc-900 dark:text-zinc-100 leading-snug">
              "${escapeHtml(comment.pesan || '')}"
            </div>
            ${deleteButtonHtml}
          </div>
          <div class="mt-2 flex items-center justify-between font-mono text-[10px] text-zinc-500 dark:text-zinc-400 border-t border-dashed border-zinc-300 dark:border-zinc-700 pt-1">
            <span>&pen; ${escapeHtml(comment.nama || 'Pembaca')}</span>
            <span>${escapeHtml(comment.waktu || '')}</span>
          </div>
        `;
        container.appendChild(item);
      });
    }, (err) => {
      console.error("Firestore error: ", err);
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
